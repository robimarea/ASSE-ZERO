<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Core (baseline — react-helmet-async sovrascrive dinamicamente) -->
    <title>ASSE ZERO — Produzione Video &amp; Social Media Management</title>
    <meta name="description" content="ASSE ZERO è un team creativo di 4 professionisti specializzati in produzione video professionale, social media management e content strategy. Spot pubblicitari, videoclip, documentari, reel cinematografici e gestione social su misura per il tuo brand." />
    <meta name="keywords" content="produzione video, social media management, content strategy, videomaker, spot pubblicitario, videoclip, documentario, motion graphics, reel, gestione social, instagram, tiktok, consulenza brand, post produzione, color grading" />
    <meta name="author" content="ASSE ZERO" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://assezero.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ASSE ZERO — Produzione Video &amp; Social Media Management" />
    <meta property="og:description" content="Team creativo specializzato in produzione video professionale e social media management. Spot, videoclip, documentari, reel cinematografici e gestione social su misura." />
    <meta property="og:url" content="https://assezero.com" />
    <meta property="og:site_name" content="ASSE ZERO" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:image" content="https://assezero.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ASSE ZERO — Produzione Video &amp; Social Media Management" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASSE ZERO — Produzione Video &amp; Social Media Management" />
    <meta name="twitter:description" content="Team creativo specializzato in produzione video professionale e social media management. Spot, videoclip, documentari, reel cinematografici e gestione social su misura." />
    <meta name="twitter:image" content="https://assezero.com/og-image.png" />
    <meta name="twitter:image:alt" content="ASSE ZERO — Produzione Video &amp; Social Media Management" />
    <meta name="twitter:site" content="@assezero" />
    <meta name="twitter:creator" content="@assezero" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#E9AC06" />
    <meta name="msapplication-TileColor" content="#E9AC06" />

    <!-- Font: Nohemi e Satoshi sono bundlati da Vite come asset (preload automatico) -->
    <!-- I vecchi preload di AlteHaasGrotesk erano obsoleti e causavano richieste 404 -->

    <!-- Structured Data: LocalBusiness + ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["ProfessionalService", "LocalBusiness"],
        "@id": "https://assezero.com/#organization",
        "name": "ASSE ZERO",
        "alternateName": "Asse Zero Produzioni",
        "description": "ASSE ZERO è un team creativo di 4 professionisti specializzati in produzione video professionale, social media management e content strategy. Offriamo spot pubblicitari, videoclip, documentari, motion graphics, reel e gestione completa dei canali social.",
        "url": "https://assezero.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://assezero.com/logo.png",
          "width": "512",
          "height": "512"
        },
        "image": "https://assezero.com/og-image.png",
        "email": "assezeroinfo@gmail.com",
        "foundingDate": "2025",
        "numberOfEmployees": {
          "@type": "QuantitativeValue",
          "value": "4"
        },
        "areaServed": [
          {
            "@type": "Country",
            "name": "Italia"
          }
        ],
        "knowsAbout": [
          "Produzione Video",
          "Social Media Management",
          "Content Strategy",
          "Video Editing",
          "Post-Produzione",
          "Color Grading",
          "Motion Graphics",
          "Spot Pubblicitari",
          "Videoclip Musicali",
          "Documentari"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servizi ASSE ZERO",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Produzione Video Professionale",
                "description": "Spot pubblicitari, videoclip, documentari, corporate video e motion graphics in qualità cinematografica."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Social Media Management",
                "description": "Gestione completa dei profili social, content strategy, reel e analisi dei competitors."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Post-Produzione",
                "description": "Montaggio, color grading, VFX, sound design e motion design."
              }
            }
          ]
        },
        "sameAs": [
          "https://www.instagram.com/assezero"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
